name: CI

on:
  push:
    branches-ignore:
      - main
      - '**/graphite-base/**'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  guard:
    permissions:
      contents: read
      pull-requests: read
    name: Guard
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          # Skip merge-queue staging branches; Graphite validates the integrated state.
          if [[ "${HEAD_REF}" == gtmq_merge_* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip push CI when an open PR already covers this branch.
          # GitHub always delivers pull_request synchronize for PR-head pushes;
          # the push trigger is only for restacks without an open PR.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            PR_COUNT=$(gh pr list --repo "$GITHUB_REPOSITORY" \
              --head "$BRANCH" --state open \
              --json number --jq 'length')
            if [[ "$PR_COUNT" -gt 0 ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Push CI skipped: open PR exists; pull_request handles this push"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
  tap-ci:
    name: Tap CI
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Validate repository files
        run: |
          test -f README.md
          test -f LICENSE
          test -f .github/CODEOWNERS

      - name: Validate README release badge matches formula
        run: |
          tag=$(sed -n 's/.*tags\/\(rusty-jack-v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' Formula/rusty-jack.rb | head -1)
          version="${tag#rusty-jack-}"
          grep -qF "rusty--jack-${version}-blue" README.md || {
            echo "README release badge must show ${version} (from Formula/rusty-jack.rb tag ${tag})"
            exit 1
          }

      - name: Validate formulas
        run: |
          if compgen -G "Formula/*.rb" > /dev/null; then
            ruby -c Formula/*.rb
            brew tap the-hcma/tap "$PWD"
            for formula in Formula/*.rb; do
              brew audit --strict --online "the-hcma/tap/$(basename "${formula}" .rb)"
            done
          else
            echo "No formulas yet."
          fi
  secret-scan:
    name: Secret Scan
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Secret Scan
        env:
          GITLEAKS_BASE: ${{ github.event.pull_request.base.sha || '' }}
          GITLEAKS_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/ci/secret-scan
